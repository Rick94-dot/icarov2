<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÍCARO — Conectado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --white: #ffffff; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  /* Envelope que recebe o efeito de "zoom para fora" ao revelar a
     página — parte de um zoom aproximado (scale > 1, opacidade 0)
     e assenta em escala normal, dando a sensação de a câmera se
     afastar até o globo aparecer por inteiro. */
  #zoom-wrap {
    position: fixed;
    inset: 0;
    transform: scale(1.55);
    opacity: 0;
    transform-origin: 50% 50%;
    transition: transform 1.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.3s ease;
    will-change: transform, opacity;
  }

  #zoom-wrap.in {
    transform: scale(1);
    opacity: 1;
  }

  #chromatic-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: #000;
  }

  #globe-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  #text-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    pointer-events: none;
    text-align: center;
    padding: 9vh 20px 0;
    transition: opacity 0.8s ease;
    opacity: 1;
  }

  #text-overlay.fade-out {
    opacity: 0;
  }

  #connected-text {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(34px, 7vw, 72px);
    color: var(--white);
    letter-spacing: -0.01em;
    white-space: pre-wrap;
    min-height: 1.2em;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.6), 0 0 26px rgba(255, 255, 255, 0.25);
  }

  #cursor {
    display: inline-block;
    margin-left: 4px;
    color: var(--white);
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ---------- campo de CNPJ, centralizado sobre o globo ---------- */
  #cnpj-stage {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }

  #cnpj-stage.show {
    opacity: 1;
    pointer-events: auto;
  }

  .cnpj-card {
    width: 100%;
    max-width: 380px;
    padding: 40px 34px 32px;
    border-radius: 20px;
    background: #0c0c10;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 255, 255, 0.05);
    text-align: center;
  }

  .cnpj-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 26px;
    color: var(--white);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .cnpj-subtitle {
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: rgba(255, 255, 255, 0.5);
    margin: 0 0 28px;
  }

  .cnpj-field {
    text-align: left;
    margin-bottom: 22px;
  }

  .cnpj-field label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.65);
    margin-bottom: 8px;
  }

  .cnpj-field input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04);
    color: var(--white);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 16px;
    letter-spacing: 0.5px;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .cnpj-field input::placeholder { color: rgba(255,255,255,0.28); }

  .cnpj-field input:focus {
    border-color: rgba(255,255,255,0.55);
    background: rgba(255, 255, 255, 0.07);
  }

  .cnpj-field input.valid {
    border-color: #4ade80;
    background: rgba(74, 222, 128, 0.06);
  }

  .cnpj-field input.invalid {
    border-color: #ff5c5c;
    background: rgba(255, 92, 92, 0.06);
  }

  .cnpj-error {
    display: none;
    margin: 8px 2px 0;
    font-size: 12px;
    color: #ff6b6b;
  }

  .cnpj-error.show { display: block; }

  .cnpj-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--white);
    color: #0a0a0e;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
  }

  .cnpj-btn:hover:not(:disabled) { opacity: 0.88; }
  .cnpj-btn:active:not(:disabled) { transform: scale(0.98); }

  .cnpj-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  @media (prefers-reduced-motion: reduce) {
    #zoom-wrap { transition: opacity 0.6s ease; transform: none !important; }
    #cursor { animation: none; opacity: 1; }
  }

  #logoutBtn {
    position: fixed;
    top: 24px;
    right: 28px;
    z-index: 10;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(10, 10, 14, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.3px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, background 0.2s ease;
  }

  #logoutBtn.show {
    opacity: 1;
    pointer-events: auto;
  }

  #logoutBtn:hover {
    background: rgba(255, 255, 255, 0.1);
  }
</style>
</head>
<body>

  <div id="zoom-wrap">
    <div id="chromatic-bg"></div>
    <div id="globe-container"></div>

    <button id="logoutBtn" type="button">Sair</button>

    <div id="text-overlay">
      <div id="connected-text"><span id="typedText2"></span><span id="cursor">_</span></div>
    </div>

    <div id="cnpj-stage">
      <div class="cnpj-card">
        <h2 class="cnpj-title">Consultar prestador</h2>
        <p class="cnpj-subtitle">Digite o CNPJ para continuar</p>
        <div class="cnpj-field">
          <label for="cnpjInput">CNPJ</label>
          <input type="text" id="cnpjInput" inputmode="numeric" placeholder="00.000.000/0000-00" maxlength="18" autocomplete="off">
          <p class="cnpj-error" id="cnpjError">CNPJ inválido.</p>
        </div>
        <button type="button" class="cnpj-btn" id="cnpjBtn" disabled>Buscar</button>
      </div>
    </div>
  </div>

<script type="module">
  // ============================================================
  // GLOBE — porta em vanilla JS/three.js do componente Originkit.
  // Esfera com pontos brancos sobre as massas terrestres +
  // contornos dos continentes, rotação automática e arraste com
  // o mouse/toque. Recolorido para o branco/preto do ÍCARO.
  // ============================================================
  import * as THREE from 'https://esm.sh/three@0.160.0';
  import { geoEquirectangular, geoPath } from 'https://esm.sh/d3-geo@3';
  import { Renderer, Camera, Mesh, Plane, Program, RenderTarget as OglRenderTarget } from 'https://esm.sh/ogl@1.0.6';

  // ============================================================
  // CHROMATIC WAVES — porta em vanilla JS/OGL do componente
  // Originkit. Roda ruído Perlin animado num render target e usa
  // o brilho resultante para desenhar uma trama de pontos (efeito
  // "halftone"). Com a paleta padrão (branco sobre preto) fica
  // como o fundo de pontos pulsantes do ÍCARO.
  // ============================================================
  function initChromaticBg(container) {
    const perlinVertexShader = `#version 300 es
in vec2 uv;
in vec2 position;
out vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0., 1.);
}`;

    const perlinFragmentShader = `#version 300 es
precision mediump float;
uniform float uFrequency;
uniform float uTime;
uniform float uSpeed;
uniform float uValue;
uniform vec2 uResolution;
in vec2 vUv;
out vec4 fragColor;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
  const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min( g.xyz, l.zxy );
  vec3 i2 = max( g.xyz, l.zxy );
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute( permute( permute(
             i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
           + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
           + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
  float n_ = 0.142857142857;
  vec3  ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_ );
  vec4 x = x_ *ns.x + ns.yyyy;
  vec4 y = y_ *ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4( x.xy, y.xy );
  vec4 b1 = vec4( x.zw, y.zw );
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
  vec3 p0 = vec3(a0.xy,h.x);
  vec3 p1 = vec3(a0.zw,h.y);
  vec3 p2 = vec3(a1.xy,h.z);
  vec3 p3 = vec3(a1.zw,h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x;
  p1 *= norm.y;
  p2 *= norm.z;
  p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
}

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

void main() {
  vec2 uv = vUv;
  float aspect = uResolution.x / max(uResolution.y, 1.0);
  uv = (uv - 0.5) * vec2(aspect, 1.0) + 0.5;
  float hue = abs(snoise(vec3(uv * uFrequency, uTime * uSpeed)));
  vec3 rainbowColor = hsv2rgb(vec3(hue, 1.0, uValue));
  fragColor = vec4(rainbowColor, 1.0);
}`;

    const dotVertexShader = `#version 300 es
in vec2 uv;
in vec2 position;
out vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0., 1.);
}`;

    const dotFragmentShader = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform sampler2D uTexture;
uniform int uPaletteCount;
uniform vec3 uPalette[10];
uniform float uPaletteAlpha[10];
uniform float uCellSize;
uniform float uGamma;
uniform float uPaletteBias;
out vec4 fragColor;

void main() {
  vec2 pix = gl_FragCoord.xy;
  float cell = max(uCellSize, 1.0);

  vec2 cellIdx = floor(pix / cell);
  vec2 cellCenter = (cellIdx + 0.5) * cell;
  vec3 col = texture(uTexture, cellCenter / uResolution.xy).rgb;
  float gray = 0.3 * col.r + 0.59 * col.g + 0.11 * col.b;
  gray = pow(clamp(gray, 0.0001, 1.0), uGamma);

  vec2 cellUV = fract(pix / cell) - 0.5;
  float dist = length(cellUV);
  float radius = clamp(gray + uPaletteBias, 0.0, 1.0) * 0.5;
  float aa = fwidth(dist) + 1e-4;
  float mark = 1.0 - smoothstep(radius - aa, radius + aa, dist);

  float g2 = clamp(gray + uPaletteBias, 0.0, 1.0);
  int cnt = max(uPaletteCount, 1);
  vec3 dotCol;
  float dotOpacity;
  if (cnt <= 1) {
    dotCol = uPalette[0];
    dotOpacity = uPaletteAlpha[0];
  } else {
    float scaled = g2 * float(cnt - 1);
    int seg = int(floor(scaled));
    seg = clamp(seg, 0, cnt - 2);
    float f = clamp(scaled - float(seg), 0.0, 1.0);
    dotCol = mix(uPalette[seg], uPalette[seg + 1], f);
    dotOpacity = mix(uPaletteAlpha[seg], uPaletteAlpha[seg + 1], f);
  }
  fragColor = vec4(dotCol, mark * dotOpacity);
}`;

    // ---- Configuração (padrões do componente) ----
    const CFG = {
      frequency: 1,
      speed: 4,
      bgColor: '#000000',
      colors: ['#ffffff'],
      cellSize: 34,
      gamma: 6,
      paletteBias: -3,
    };

    function parseColorToRgba(input) {
      const hex = input.replace('#', '');
      if (hex.length === 6) {
        return [
          parseInt(hex.slice(0, 2), 16) / 255,
          parseInt(hex.slice(2, 4), 16) / 255,
          parseInt(hex.slice(4, 6), 16) / 255,
          1,
        ];
      }
      return [1, 1, 1, 1];
    }

    const mapLinear = (v, i0, i1, o0, o1) => (i1 === i0 ? o0 : o0 + ((v - i0) / (i1 - i0)) * (o1 - o0));
    const mapFrequency = (ui) => mapLinear(ui, 1, 10, 0.3, 6);
    const mapSpeed = (ui) => ui * 0.05;
    const mapCellSize = (ui) => mapLinear(ui, 1, 100, 6, 60);
    const mapGamma = (ui) => mapLinear(ui, 1, 20, 0.5, 8);
    const mapPaletteBias = (ui) => ui * 0.05;

    const MAX_COLORS = 10;
    const rgb = [], alpha = [];
    for (let i = 0; i < MAX_COLORS; i++) {
      const src = CFG.colors[i];
      if (src != null) {
        const [r, g, b, a] = parseColorToRgba(src);
        rgb.push([r, g, b]);
        alpha.push(a);
      } else {
        rgb.push([0, 0, 0]);
        alpha.push(0);
      }
    }
    const effPaletteCount = Math.min(MAX_COLORS, Math.max(1, CFG.colors.length));

    const renderer = new Renderer({ dpr: Math.min(window.devicePixelRatio || 1, 2), alpha: true, premultipliedAlpha: false });
    const gl = renderer.gl;
    container.appendChild(gl.canvas);
    gl.canvas.style.position = 'absolute';
    gl.canvas.style.inset = '0';
    gl.canvas.style.width = '100%';
    gl.canvas.style.height = '100%';
    gl.canvas.style.display = 'block';

    const camera = new Camera(gl, { near: 0.1, far: 100 });
    camera.position.set(0, 0, 3);

    function doResize() {
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;
      renderer.setSize(width, height);
      camera.perspective({ aspect: gl.canvas.width / gl.canvas.height });
      if (renderTarget && renderTarget.setSize) renderTarget.setSize(gl.canvas.width, gl.canvas.height);
      if (perlinProgram) perlinProgram.uniforms.uResolution.value = [gl.canvas.width, gl.canvas.height];
    }

    let resizePending = false;
    function scheduleResize() {
      if (resizePending) return;
      resizePending = true;
      requestAnimationFrame(() => { resizePending = false; doResize(); });
    }
    window.addEventListener('resize', scheduleResize);
    if (typeof window.ResizeObserver !== 'undefined') new ResizeObserver(scheduleResize).observe(container);

    const perlinProgram = new Program(gl, {
      vertex: perlinVertexShader,
      fragment: perlinFragmentShader,
      uniforms: {
        uTime: { value: 0 },
        uFrequency: { value: mapFrequency(CFG.frequency) },
        uSpeed: { value: mapSpeed(CFG.speed) },
        uValue: { value: 1 },
        uResolution: { value: [gl.canvas.width, gl.canvas.height] },
      },
    });
    const perlinMesh = new Mesh(gl, { geometry: new Plane(gl, { width: 2, height: 2 }), program: perlinProgram });

    const renderTarget = new OglRenderTarget(gl);

    const dotProgram = new Program(gl, {
      vertex: dotVertexShader,
      fragment: dotFragmentShader,
      uniforms: {
        uResolution: { value: [gl.canvas.width, gl.canvas.height] },
        uTexture: { value: renderTarget.texture },
        uPaletteCount: { value: effPaletteCount },
        uPalette: { value: rgb },
        uPaletteAlpha: { value: alpha },
        uCellSize: { value: mapCellSize(CFG.cellSize) },
        uGamma: { value: mapGamma(CFG.gamma) },
        uPaletteBias: { value: mapPaletteBias(CFG.paletteBias) },
      },
    });
    const dotMesh = new Mesh(gl, { geometry: new Plane(gl, { width: 2, height: 2 }), program: dotProgram });

    // ---- Ciclo de cores do fundo — começa em branco e faz
    // transições suaves entre 3 cores, em loop contínuo. ----
    const BG_COLORS = ['#ffffff', '#e8a94b', '#5ec8ff'];
    const BG_SEGMENT_MS = 6000; // duração de cada transição
    const bgColorsRgb = BG_COLORS.map((c) => parseColorToRgba(c));

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function currentBgRgb(elapsedMs) {
      const n = bgColorsRgb.length;
      const total = n * BG_SEGMENT_MS;
      const t = elapsedMs % total;
      const idx = Math.floor(t / BG_SEGMENT_MS);
      const localT = easeInOutQuad((t % BG_SEGMENT_MS) / BG_SEGMENT_MS);
      const a = bgColorsRgb[idx];
      const b = bgColorsRgb[(idx + 1) % n];
      return [
        a[0] + (b[0] - a[0]) * localT,
        a[1] + (b[1] - a[1]) * localT,
        a[2] + (b[2] - a[2]) * localT,
      ];
    }

    function buildPaletteArray(rgbColor) {
      const arr = [rgbColor];
      for (let i = 1; i < MAX_COLORS; i++) arr.push([0, 0, 0]);
      return arr;
    }

    doResize();

    const frameInterval = 1000 / 30;
    let lastTime = 0;
    let bgStartTime = null;
    function update(time) {
      if (time - lastTime < frameInterval) {
        requestAnimationFrame(update);
        return;
      }
      lastTime = time;
      if (bgStartTime === null) bgStartTime = time;
      perlinProgram.uniforms.uTime.value = time * 0.001;
      renderer.render({ scene: perlinMesh, camera, target: renderTarget });
      dotProgram.uniforms.uResolution.value = [gl.canvas.width, gl.canvas.height];
      dotProgram.uniforms.uPalette.value = buildPaletteArray(currentBgRgb(time - bgStartTime));
      renderer.render({ scene: dotMesh, camera });
      requestAnimationFrame(update);
    }
    renderer.render({ scene: perlinMesh, camera, target: renderTarget });
    renderer.render({ scene: dotMesh, camera });
    requestAnimationFrame(update);
  }

  initChromaticBg(document.getElementById('chromatic-bg'));

  const CONFIG = {
    speed: 2,
    smoothing: 8,
    dotColor: '#ffffff',
    dotSize: 5,
    density: 6,
    allDots: false,
    scale: 8,
    stopOnHover: false,
    direction: 'left',
    initialLatitude: 23,
    initialLongitude: -23,
    oceanColor: '#000000',
    outlineColor: '#ffffff',
    showOutline: true,
    graticuleColor: 'rgba(255,255,255,0.10)',
    showGrid: true,
    outlineWidth: 1,
    dragSpeed: 5,
    detail: 4,
  };

  function parseColorToRgba(input) {
    if (!input || input.trim() === '') return { r: 0, g: 0, b: 0, a: 0 };
    const str = input.trim();
    const rgbaMatch = str.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)/i);
    if (rgbaMatch) {
      return {
        r: Math.max(0, Math.min(255, parseFloat(rgbaMatch[1]))) / 255,
        g: Math.max(0, Math.min(255, parseFloat(rgbaMatch[2]))) / 255,
        b: Math.max(0, Math.min(255, parseFloat(rgbaMatch[3]))) / 255,
        a: rgbaMatch[4] !== undefined ? Math.max(0, Math.min(1, parseFloat(rgbaMatch[4]))) : 1,
      };
    }
    const hex = str.replace(/^#/, '');
    if (hex.length === 6) {
      return {
        r: parseInt(hex.slice(0, 2), 16) / 255,
        g: parseInt(hex.slice(2, 4), 16) / 255,
        b: parseInt(hex.slice(4, 6), 16) / 255,
        a: 1,
      };
    }
    return { r: 1, g: 1, b: 1, a: 1 };
  }

  function mapLinear(value, inMin, inMax, outMin, outMax) {
    if (inMax === inMin) return outMin;
    const t = (value - inMin) / (inMax - inMin);
    return outMin + t * (outMax - outMin);
  }
  const mapSpeedUiToInternal = (ui) => (ui === 0 ? 0 : mapLinear(Math.max(0, Math.min(10, ui)), 0, 10, 0, 0.9));
  const mapDensityUiToSpacing = (ui) => mapLinear(Math.max(1, Math.min(10, ui)), 1, 10, 24, 8);
  const mapScaleUiToMultiplier = (ui) => mapLinear(Math.max(1, Math.min(20, ui)), 1, 20, 0.2, 2);
  const mapDotSizeUiToMultiplier = (ui) => mapLinear(Math.max(1, Math.min(10, ui)), 1, 10, 0.1, 0.5);
  const normalizeSmoothing = (ui) => Math.max(0, Math.min(1, ui / 10));
  const mapDragSpeedUiToSensitivity = (ui) => mapLinear(Math.max(0, Math.min(10, ui)), 0, 10, 0.001, 0.02);
  const mapDetailToStepSize = (ui) => mapLinear(Math.max(1, Math.min(10, ui)), 1, 10, 10, 1);

  function simplifyRing(ring, detail) {
    if (ring.length < 2) return ring;
    if (detail >= 10) return ring;
    const stepSize = Math.max(1, Math.floor(mapDetailToStepSize(detail)));
    const simplified = [ring[0]];
    for (let i = stepSize; i < ring.length - 1; i += stepSize) {
      simplified.push(ring[Math.min(i, ring.length - 1)]);
    }
    const last = ring[ring.length - 1];
    const first = ring[0];
    const closed = Math.abs(last[0] - first[0]) < 1e-4 && Math.abs(last[1] - first[1]) < 1e-4;
    if (!closed) simplified.push(last);
    return simplified.length >= 2 ? simplified : ring;
  }

  function latLngToPosition(lat, lng) {
    const latRad = lat * (Math.PI / 180);
    const lngRad = lng * (Math.PI / 180);
    return {
      x: Math.cos(latRad) * Math.sin(lngRad),
      y: Math.sin(latRad),
      z: Math.cos(latRad) * Math.cos(lngRad),
    };
  }

  const container = document.getElementById('globe-container');
  const containerWidth = container.clientWidth || window.innerWidth || 800;
  const containerHeight = container.clientHeight || window.innerHeight || 600;

  const scaleMultiplier = mapScaleUiToMultiplier(CONFIG.scale);
  const dotSpacing = mapDensityUiToSpacing(CONFIG.density);
  const dotSizeMultiplier = mapDotSizeUiToMultiplier(CONFIG.dotSize);
  const smoothingN = normalizeSmoothing(CONFIG.smoothing);
  const baseRotationSpeed = mapSpeedUiToInternal(CONFIG.speed);
  const rotationSpeed = CONFIG.direction === 'left' ? -baseRotationSpeed : baseRotationSpeed;

  const oceanRgba = parseColorToRgba(CONFIG.oceanColor);
  const outlineRgba = parseColorToRgba(CONFIG.outlineColor);
  const dotRgba = parseColorToRgba(CONFIG.dotColor);
  const graticuleRgba = parseColorToRgba(CONFIG.graticuleColor);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, containerWidth / containerHeight, 0.1, 1000);
  const baseRadius = 1;
  const globeRadius = baseRadius * scaleMultiplier;
  let cameraDistance = 2.5 / scaleMultiplier;
  camera.position.set(0, 0, cameraDistance);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(containerWidth, containerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const canvas = renderer.domElement;
  Object.assign(canvas.style, {
    position: 'absolute', inset: '0', width: '100%', height: '100%',
    display: 'block', opacity: '0', transition: 'opacity 0.6s ease',
  });
  container.appendChild(canvas);

  const oceanGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
  const oceanMaterial = new THREE.MeshBasicMaterial({
    color: new THREE.Color(CONFIG.oceanColor),
    transparent: oceanRgba.a < 1,
    opacity: oceanRgba.a,
  });
  const oceanMesh = new THREE.Mesh(oceanGeometry, oceanMaterial);

  const continentOutlineGroup = new THREE.Group();
  const graticuleGroup = new THREE.Group();

  if (CONFIG.showGrid && graticuleRgba.a > 0) {
    const graticuleMaterial = new THREE.LineBasicMaterial({
      color: new THREE.Color(CONFIG.graticuleColor.startsWith('rgba') ? '#ffffff' : CONFIG.graticuleColor),
      transparent: true,
      opacity: graticuleRgba.a,
    });
    const gridSpacing = 15;
    for (let lat = -75; lat <= 75; lat += gridSpacing) {
      const pts = [];
      for (let i = 0; i <= 64; i++) {
        const lng = (i / 64) * 360 - 180;
        const p = latLngToPosition(lat, lng);
        pts.push(new THREE.Vector3(p.x * globeRadius, p.y * globeRadius, p.z * globeRadius));
      }
      graticuleGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), graticuleMaterial));
    }
    for (let lng = -180; lng < 180; lng += gridSpacing) {
      const pts = [];
      for (let i = 0; i <= 64; i++) {
        const lat = (i / 64) * 180 - 90;
        const p = latLngToPosition(lat, lng);
        pts.push(new THREE.Vector3(p.x * globeRadius, p.y * globeRadius, p.z * globeRadius));
      }
      graticuleGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), graticuleMaterial));
    }
  }

  const globeGroup = new THREE.Group();
  const initialLongitudeRad = (CONFIG.initialLongitude * Math.PI) / 180;
  const initialLatitudeRad = (CONFIG.initialLatitude * Math.PI) / 180;
  globeGroup.rotation.y = initialLongitudeRad;
  globeGroup.rotation.x = initialLatitudeRad;
  scene.add(globeGroup);
  globeGroup.add(oceanMesh);
  if (CONFIG.showGrid && graticuleRgba.a > 0) globeGroup.add(graticuleGroup);
  globeGroup.add(continentOutlineGroup);

  let dotInstances = null;

  // Pega o usuário salvo no login e monta uma saudação — sorteada
  // entre algumas variações toda vez que a página carrega, pra não
  // ficar repetitivo a cada entrada.
  function getGreeting() {
    let user = null;
    try { user = JSON.parse(localStorage.getItem('icaro_user') || 'null'); }
    catch (e) { user = null; }

    const rawName = (user && user.username) ? user.username : 'visitante';
    const name = rawName.charAt(0).toUpperCase() + rawName.slice(1);

    const options = [
      'Olá, ' + name,
      'Bom ter você aqui, ' + name,
      'Quem vamos procurar hoje, ' + name + '?',
    ];
    return options[Math.floor(Math.random() * options.length)];
  }

  function startTypewriter() {
    const text = getGreeting();
    const typeDelayMs = 70;
    const holdBeforeFadeMs = 2200;
    const typedEl = document.getElementById('typedText2');
    const textOverlay = document.getElementById('text-overlay');
    const cnpjStage = document.getElementById('cnpj-stage');
    let i = 0;
    (function typeNext() {
      if (i < text.length) {
        typedEl.textContent += text[i];
        i++;
        setTimeout(typeNext, typeDelayMs);
      } else {
        setTimeout(function () {
          textOverlay.classList.add('fade-out');
          setTimeout(function () {
            cnpjStage.classList.add('show');
          }, 500);
        }, holdBeforeFadeMs);
      }
    })();
  }

  function revealPage() {
    canvas.style.opacity = '1';
    document.getElementById('zoom-wrap').classList.add('in');
    setTimeout(startTypewriter, 500);
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) logoutBtn.classList.add('show');
  }
  let revealed = false;
  function revealOnce() {
    if (revealed) return;
    revealed = true;
    revealPage();
  }
  // Rede de segurança: revela mesmo que os dados do mapa demorem/quebrem.
  setTimeout(revealOnce, 4000);

  async function loadWorldData() {
    try {
      const response = await fetch('https://raw.githubusercontent.com/martynafford/natural-earth-geojson/refs/heads/master/50m/physical/ne_50m_land.json');
      if (!response.ok) throw new Error('Failed to load land data');
      const landFeatures = await response.json();

      if (CONFIG.showOutline && outlineRgba.a > 0) {
        const outlineMaterial = new THREE.LineBasicMaterial({
          color: new THREE.Color(CONFIG.outlineColor),
          transparent: outlineRgba.a < 1,
          opacity: outlineRgba.a,
        });
        const processRing = (ring) => {
          if (ring.length < 2) return;
          const simplified = simplifyRing(ring, CONFIG.detail);
          const pts = simplified.map(([lng, lat]) => {
            const p = latLngToPosition(lat, lng);
            return new THREE.Vector3(p.x * globeRadius, p.y * globeRadius, p.z * globeRadius);
          });
          if (pts.length >= 2) {
            if (pts[0].distanceTo(pts[pts.length - 1]) > 0.001) pts.push(pts[0].clone());
            continentOutlineGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), outlineMaterial));
          }
        };
        landFeatures.features.forEach((feature) => {
          const geometry = feature.geometry;
          if (!geometry || !geometry.coordinates) return;
          if (geometry.type === 'Polygon' && geometry.coordinates.length > 0) {
            processRing(geometry.coordinates[0]);
          } else if (geometry.type === 'MultiPolygon') {
            geometry.coordinates.forEach((poly) => { if (poly.length > 0) processRing(poly[0]); });
          }
        });
      }

      const bitmapWidth = 2048, bitmapHeight = 1024;
      const offscreen = document.createElement('canvas');
      offscreen.width = bitmapWidth;
      offscreen.height = bitmapHeight;
      const ctx = offscreen.getContext('2d', { willReadFrequently: true });
      const projection = geoEquirectangular().fitSize([bitmapWidth, bitmapHeight], { type: 'Sphere' });
      const pathGenerator = geoPath().projection(projection).context(ctx);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, bitmapWidth, bitmapHeight);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      landFeatures.features.forEach((feature) => pathGenerator(feature));
      ctx.fill();
      const imageData = ctx.getImageData(0, 0, bitmapWidth, bitmapHeight);
      const pixels = imageData.data;
      const isOnLand = (lng, lat) => {
        const x = Math.round(((lng + 180) / 360) * bitmapWidth) % bitmapWidth;
        const y = Math.round(((90 - lat) / 180) * bitmapHeight);
        const clampedY = Math.max(0, Math.min(bitmapHeight - 1, y));
        const idx = (clampedY * bitmapWidth + x) * 4;
        return pixels[idx] > 128;
      };

      const dotCoordinates = [];
      const baseStep = dotSpacing * 0.08;
      for (let lat = -90; lat <= 90; lat += baseStep) {
        const latRad = (Math.abs(lat) * Math.PI) / 180;
        const cosLat = Math.cos(latRad);
        const lngStep = cosLat > 0.01 ? baseStep / Math.max(0.3, cosLat) : 360;
        for (let lng = -180; lng < 180; lng += lngStep) {
          if (CONFIG.allDots || isOnLand(lng, lat)) dotCoordinates.push([lng, lat]);
        }
      }

      if (dotCoordinates.length > 0) {
        const dotGeometry = new THREE.SphereGeometry(0.01 * dotSizeMultiplier, 4, 4);
        const dotMaterial = new THREE.MeshBasicMaterial({
          color: new THREE.Color(CONFIG.dotColor),
          transparent: dotRgba.a < 1,
          opacity: dotRgba.a,
        });
        const instanced = new THREE.InstancedMesh(dotGeometry, dotMaterial, dotCoordinates.length);
        const matrix = new THREE.Matrix4();
        dotCoordinates.forEach(([lng, lat], i) => {
          const p = latLngToPosition(lat, lng);
          matrix.setPosition(p.x * globeRadius, p.y * globeRadius, p.z * globeRadius);
          instanced.setMatrixAt(i, matrix);
        });
        instanced.instanceMatrix.needsUpdate = true;
        dotInstances = instanced;
        globeGroup.add(dotInstances);
      }

      renderer.render(scene, camera);
      revealOnce();
    } catch (err) {
      console.error('[ÍCARO Globe] erro ao carregar dados do mapa:', err);
      renderer.render(scene, camera);
      revealOnce();
    }
  }

  // ---- Rotação automática + arraste (mouse e toque) ----
  const rotation = { x: initialLongitudeRad, y: initialLatitudeRad };
  const targetRotation = { x: initialLongitudeRad, y: initialLatitudeRad };
  const velocity = { x: 0, y: 0 };
  let isDragging = false;
  let isHovering = false;
  let lastX = 0, lastY = 0;
  let animationFrameId = null;
  const lerpFactor = smoothingN === 0 ? 1 : mapLinear(smoothingN, 0, 1, 0.4, 0.03);
  const velocityDecay = mapLinear(smoothingN, 0, 1, 0.7, 0.96);
  const threshold = 0.01;

  function animate() {
    if (!isDragging && rotationSpeed !== 0 && (!CONFIG.stopOnHover || !isHovering)) {
      targetRotation.x += rotationSpeed * 0.01;
    }
    if (!isDragging && smoothingN > 0) {
      if (Math.abs(velocity.x) > threshold || Math.abs(velocity.y) > threshold) {
        targetRotation.x += velocity.x;
        targetRotation.y += velocity.y;
        targetRotation.y = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.y));
        velocity.x *= velocityDecay;
        velocity.y *= velocityDecay;
      } else {
        velocity.x = 0; velocity.y = 0;
      }
    }
    const dx = targetRotation.x - rotation.x;
    const dy = targetRotation.y - rotation.y;
    rotation.x += dx * lerpFactor;
    rotation.y += dy * lerpFactor;
    rotation.y = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.y));
    globeGroup.rotation.y = rotation.x;
    globeGroup.rotation.x = rotation.y;
    renderer.render(scene, camera);

    const hasVelocity = Math.abs(velocity.x) > threshold || Math.abs(velocity.y) > threshold;
    const hasLerpDelta = Math.abs(dx) > threshold || Math.abs(dy) > threshold;
    if (isDragging || rotationSpeed !== 0 || hasVelocity || hasLerpDelta) {
      animationFrameId = requestAnimationFrame(animate);
    } else {
      animationFrameId = null;
    }
  }
  function startAnimation() {
    if (animationFrameId === null) animationFrameId = requestAnimationFrame(animate);
  }
  if (rotationSpeed !== 0) startAnimation();

  function dragStart(clientX, clientY) {
    isDragging = true;
    velocity.x = 0; velocity.y = 0;
    lastX = clientX; lastY = clientY;
    startAnimation();
  }
  function dragMove(clientX, clientY) {
    if (!isDragging) return;
    const sensitivity = mapDragSpeedUiToSensitivity(CONFIG.dragSpeed);
    const dx = clientX - lastX;
    const dy = clientY - lastY;
    targetRotation.x += dx * sensitivity;
    targetRotation.y += dy * sensitivity;
    targetRotation.y = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.y));
    velocity.x = dx * sensitivity * 0.3;
    velocity.y = dy * sensitivity * 0.3;
    lastX = clientX; lastY = clientY;
  }
  function dragEnd() { isDragging = false; }

  canvas.addEventListener('mousedown', (e) => dragStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => dragMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', dragEnd);
  canvas.addEventListener('touchstart', (e) => { const t = e.touches[0]; dragStart(t.clientX, t.clientY); }, { passive: true });
  canvas.addEventListener('touchmove', (e) => { const t = e.touches[0]; dragMove(t.clientX, t.clientY); }, { passive: true });
  canvas.addEventListener('touchend', dragEnd);

  if (CONFIG.stopOnHover) {
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      isHovering = raycaster.intersectObject(oceanMesh).length > 0;
    });
  }

  const resizeObserver = new ResizeObserver(() => {
    const newWidth = container.clientWidth || window.innerWidth || 800;
    const newHeight = container.clientHeight || window.innerHeight || 600;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
    cameraDistance = 2.5 / scaleMultiplier;
    camera.position.set(0, 0, cameraDistance);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  });
  resizeObserver.observe(container);

  renderer.render(scene, camera);
  loadWorldData();

  // Texto "Estamos conectados" digitado com a mesma máquina de
  // escrever usada no "Bem-vindo" da tela de login — ver
  // startTypewriter() definida acima, disparada por revealPage().

</script>

<script>
  // ============================================================
  // CNPJ — máscara de digitação + validação dos dígitos
  // verificadores (algoritmo padrão módulo 11).
  // ============================================================
  (function () {
    function onlyDigits(v) {
      return v.replace(/\D/g, '').slice(0, 14);
    }

    function formatCNPJ(digits) {
      let v = digits;
      v = v.replace(/^(\d{2})(\d)/, '$1.$2');
      v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
      v = v.replace(/(\d{4})(\d)/, '$1-$2');
      return v;
    }

    function isValidCNPJ(digits) {
      if (digits.length !== 14) return false;
      if (/^(\d)\1{13}$/.test(digits)) return false; // todos os dígitos iguais

      const calcCheckDigit = (base) => {
        let length = base.length;
        let pos = length - 7;
        let sum = 0;
        for (let i = length; i >= 1; i--) {
          sum += parseInt(base.charAt(length - i), 10) * pos--;
          if (pos < 2) pos = 9;
        }
        const result = sum % 11;
        return result < 2 ? 0 : 11 - result;
      };

      const base12 = digits.substring(0, 12);
      const digit1 = calcCheckDigit(base12);
      if (digit1 !== parseInt(digits.charAt(12), 10)) return false;

      const base13 = digits.substring(0, 13);
      const digit2 = calcCheckDigit(base13);
      if (digit2 !== parseInt(digits.charAt(13), 10)) return false;

      return true;
    }

    const input = document.getElementById('cnpjInput');
    const errorMsg = document.getElementById('cnpjError');
    const btn = document.getElementById('cnpjBtn');
    const API_BASE_URL = 'https://icarov2backend.onrender.com';

    input.addEventListener('input', function () {
      const digits = onlyDigits(input.value);
      input.value = formatCNPJ(digits);

      input.classList.remove('valid', 'invalid');
      errorMsg.classList.remove('show');
      btn.disabled = true;

      if (digits.length === 0) return;

      if (digits.length < 14) {
        // ainda digitando — não mostra erro nem sucesso
        return;
      }

      if (isValidCNPJ(digits)) {
        input.classList.add('valid');
        btn.disabled = false;
      } else {
        input.classList.add('invalid');
        errorMsg.classList.add('show');
      }
    });

    btn.addEventListener('click', async function () {
      if (btn.disabled) return;
      const digits = onlyDigits(input.value);
      const formatted = formatCNPJ(digits);
      const token = localStorage.getItem('icaro_token');

      const defaultText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Buscando...';

      try {
        await fetch(API_BASE_URL + '/api/activity/search', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
          },
          body: JSON.stringify({ cnpj: formatted }),
        });
        // TODO: aqui entra a busca de verdade do CNPJ quando o
        // próximo passo do ÍCARO for definido — por enquanto só
        // registramos a busca (visível na aba Utilização do admin).
      } catch (err) {
        console.error('[ÍCARO] erro ao registrar busca:', err);
      } finally {
        btn.textContent = defaultText;
        btn.disabled = false;
      }
    });
  })();

  // ============================================================
  // Botão Sair — limpa a sessão e volta pro login.
  // ============================================================
  (function () {
    const logoutBtn = document.getElementById('logoutBtn');
    if (!logoutBtn) return;
    logoutBtn.addEventListener('click', function () {
      localStorage.removeItem('icaro_token');
      localStorage.removeItem('icaro_user');
      window.location.href = 'index.html';
    });
  })();
</script>
