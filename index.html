<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÍCARO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff;
    --white-dim: rgba(255,255,255,0.65);
    --white-faint: rgba(255,255,255,0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  body { position: relative; }

  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- palco geral ---------- */
  #stage {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* ---------- tela de boas-vindas ---------- */
  #welcome-stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: opacity 0.8s ease;
    opacity: 1;
  }

  #welcome-stage.fade-out { opacity: 0; }

  #welcome {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(40px, 8vw, 84px);
    color: var(--white);
    letter-spacing: -0.01em;
    white-space: pre-wrap;
    min-height: 1.2em;
  }

  #welcome .typed {
    color: var(--white);
    text-shadow: 0 0 26px rgba(255, 255, 255, 0.45);
  }

  #cursor {
    display: inline-block;
    margin-left: 4px;
    color: var(--white);
    opacity: 1;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ---------- tela de login ---------- */
  #login-stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }

  #login-stage.show {
    opacity: 1;
    pointer-events: auto;
  }

  .login-wrap {
    position: relative;
    width: 100%;
    max-width: 380px;
  }

  .neon-mount {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .login-card {
    position: relative;
    z-index: 2;
    padding: 44px 36px 36px;
    border-radius: 20px;
    background: #0c0c10;
    text-align: center;
  }

  .login-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 30px;
    color: var(--white);
    margin: 0 0 30px;
    letter-spacing: -0.01em;
  }

  .field {
    text-align: left;
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--white-dim);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid var(--white-faint);
    background: rgba(255, 255, 255, 0.04);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .field input::placeholder { color: rgba(255,255,255,0.28); }

  .field input:focus {
    border-color: rgba(255,255,255,0.55);
    background: rgba(255, 255, 255, 0.07);
  }

  .login-btn {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--white);
    color: #0a0a0e;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
  }

  .login-btn:hover { opacity: 0.88; }
  .login-btn:active { transform: scale(0.98); }

  .field input.invalid {
    border-color: #ff5c5c;
    background: rgba(255, 92, 92, 0.06);
  }

  .login-error {
    display: none;
    margin-top: 16px;
    font-size: 12.5px;
    letter-spacing: 0.3px;
    color: #ff6b6b;
  }

  .login-error.show { display: block; }

  /* ---------- tela de resultado (text reveal wall) ---------- */
  #result-screen {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    overflow: hidden;
  }

  #result-screen.show {
    opacity: 1;
    pointer-events: auto;
  }

  #result-wall {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 4px;
    padding: 0 4vw;
  }

  #result-wall .wall-line {
    white-space: pre;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    line-height: 1;
    width: 100%;
  }

  @media (prefers-reduced-motion: reduce) {
    #cursor { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div id="stage">

    <div id="welcome-stage">
      <div id="welcome"><span class="typed" id="typedText"></span><span id="cursor">_</span></div>
    </div>

    <div id="login-stage">
      <div class="login-wrap" id="loginWrap">
        <div class="neon-mount" id="neonMount"></div>
        <div class="login-card">
          <h1 class="login-title">Entrar</h1>
          <form id="loginForm" autocomplete="off">
            <div class="field">
              <label for="user">Usuário</label>
              <input type="text" id="user" name="user" placeholder="Digite seu usuário" required>
            </div>
            <div class="field">
              <label for="pass">Senha</label>
              <input type="password" id="pass" name="pass" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="login-btn">Entrar</button>
            <p class="login-error" id="loginError">Usuário ou senha inválidos.</p>
          </form>
        </div>
      </div>
    </div>

  </div>

  <div id="result-screen">
    <div id="result-wall"></div>
  </div>

<script type="module">
  // ============================================================
  // FUNDO — porta em vanilla JS/OGL do Ferrofluid (React Bits),
  // igual ao usado no admin.html, pra manter o mesmo visual em
  // todas as páginas do ÍCARO.
  // ============================================================

  // ============================================================
  // FERROFLUID — porta em vanilla JS/OGL do componente React Bits.
  // Superfície fluida com contorno brilhante, reagindo ao mouse.
  // Mantive as cores brancas padrão pra combinar com o resto do
  // ÍCARO.
  // ============================================================
  import { Renderer, Program, Mesh, Triangle } from 'https://esm.sh/ogl@1.0.6';

  const MAX_COLORS = 8;

  function hexToRGB(hex) {
    const c = hex.replace('#', '').padEnd(6, '0');
    return [
      parseInt(c.slice(0, 2), 16) / 255,
      parseInt(c.slice(2, 4), 16) / 255,
      parseInt(c.slice(4, 6), 16) / 255,
    ];
  }

  function prepColors(input) {
    const base = (input && input.length ? input : ['#ffffff', '#ffffff', '#ffffff']).slice(0, MAX_COLORS);
    const count = base.length;
    const arr = [];
    for (let i = 0; i < MAX_COLORS; i++) arr.push(hexToRGB(base[Math.min(i, base.length - 1)]));
    return { arr, count };
  }

  function flowVec(d) {
    switch (d) {
      case 'up': return [0, 1];
      case 'down': return [0, -1];
      case 'left': return [-1, 0];
      case 'right': return [1, 0];
      default: return [0, -1];
    }
  }

  const vertex = `
attribute vec2 position;
attribute vec2 uv;
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

  const fragment = `
precision highp float;

uniform vec3  iResolution;
uniform vec2  iMouse;
uniform float iTime;

uniform vec3  uColor0;
uniform vec3  uColor1;
uniform vec3  uColor2;
uniform vec3  uColor3;
uniform vec3  uColor4;
uniform vec3  uColor5;
uniform vec3  uColor6;
uniform vec3  uColor7;
uniform int   uColorCount;

uniform vec2  uFlow;
uniform float uSpeed;
uniform float uScale;
uniform float uTurbulence;
uniform float uFluidity;
uniform float uRimWidth;
uniform float uSharpness;
uniform float uShimmer;
uniform float uGlow;
uniform float uOpacity;
uniform float uMouseEnabled;
uniform float uMouseStrength;
uniform float uMouseRadius;

varying vec2 vUv;

#define PI 3.14159265

vec3 palette(float h) {
  int count = uColorCount;
  if (count < 1) count = 1;
  int idx = int(floor(clamp(h, 0.0, 0.999999) * float(count)));
  if (idx <= 0) return uColor0;
  if (idx == 1) return uColor1;
  if (idx == 2) return uColor2;
  if (idx == 3) return uColor3;
  if (idx == 4) return uColor4;
  if (idx == 5) return uColor5;
  if (idx == 6) return uColor6;
  return uColor7;
}

float hash(vec3 p3) {
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float smin(float a, float b, float k) {
  float r = exp2(-a / k) + exp2(-b / k);
  return -k * log2(r);
}

float sinlerp(float a, float b, float w) {
  return mix(a, b, (sin(w * PI - PI / 2.0) + 1.0) / 2.0);
}

float vn(vec2 p, float s, float seed) {
  vec2 cellp = floor(p / s);
  vec2 relp = mod(p, s);
  float g1 = hash(vec3(cellp, seed));
  float g2 = hash(vec3(cellp.x + 1.0, cellp.y, seed));
  float g3 = hash(vec3(cellp.x + 1.0, cellp.y + 1.0, seed));
  float g4 = hash(vec3(cellp.x, cellp.y + 1.0, seed));
  float bx = sinlerp(g1, g2, relp.x / s);
  float tx = sinlerp(g4, g3, relp.x / s);
  return sinlerp(bx, tx, relp.y / s);
}

float dbn(vec2 p, float s, float seed) {
  float o = s / 2.0;
  float n0 = vn(p, s, seed);
  float n1 = vn(p + vec2(o, o), s, seed + 0.1);
  float n2 = vn(p + vec2(-o, o), s, seed + 0.2);
  float n3 = vn(p + vec2(o, -o), s, seed + 0.3);
  float n4 = vn(p + vec2(-o, -o), s, seed + 0.4);
  return (2.0 * n0 + 1.5 * n1 + 1.25 * n2 + 1.125 * n3 + n4) / 7.0;
}

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  float ref = 700.0 / max(uScale, 0.05);
  vec2 p = fragCoord / iResolution.y * ref;

  float spd = 200.0 * uSpeed;
  float t = iTime;

  vec2 dir = uFlow;
  vec2 perp = vec2(-dir.y, dir.x);

  float distort1 = vn(p + perp * (t * spd), 60.0, 10.0) * 50.0 * uTurbulence;
  float distort2 = vn(p - perp * (t * spd), 120.0, 15.0) * 100.0 * uTurbulence;

  float peaks = dbn(p + distort1 + dir * (t * spd * 0.5), 40.0, 1.0);
  float peaks2 = dbn(p + distort2 - dir * (t * spd * 0.5), 40.0, 0.0);

  float mapeaks = smin(peaks, peaks2, max(uFluidity, 0.001));

  float mGlow = 0.0;
  if (uMouseEnabled > 0.5) {
    vec2 mp = iMouse / iResolution.y * ref;
    float md = length(p - mp) / ref;
    float rr = max(uMouseRadius, 0.02);
    mGlow = exp(-md * md / (rr * rr)) * uMouseStrength;
  }

  float band = (uRimWidth - abs((mapeaks - 0.4) * 2.0)) * 5.0;
  float ltn = clamp(band - vn(p + dir * (t * spd * 0.5), 60.0, 12.0) * uShimmer, 0.0, 1.0);
  ltn = pow(ltn, uSharpness) * uGlow;
  ltn *= clamp(1.0 - mGlow, 0.0, 1.0);

  float h = clamp(0.5 + (peaks - peaks2) * 0.8, 0.0, 1.0);
  vec3 col = palette(h);

  vec3 outc = col * ltn;
  float a = clamp(max(outc.r, max(outc.g, outc.b)), 0.0, 1.0);
  fragColor = vec4(outc, a * uOpacity);
}

void main() {
  vec4 color;
  mainImage(color, vUv * iResolution.xy);
  gl_FragColor = color;
}
`;

  function initFerrofluid(canvas) {
    const CFG = {
      colors: ['#ffffff', '#ffffff', '#ffffff'],
      speed: 0.5,
      scale: 1.6,
      turbulence: 1,
      fluidity: 0.1,
      rimWidth: 0.2,
      sharpness: 2.5,
      shimmer: 1.5,
      glow: 2,
      flowDirection: 'down',
      opacity: 1,
      mouseInteraction: true,
      mouseStrength: 1,
      mouseRadius: 0.35,
      mouseDampening: 0.15,
    };

    const renderer = new Renderer({ dpr: Math.min(window.devicePixelRatio || 1, 2), alpha: true, antialias: true });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 0);
    // Reaproveita o próprio <canvas id="bg-canvas"> em vez de criar um novo.
    const container = canvas.parentElement;

    const { arr, count } = prepColors(CFG.colors);

    const uniforms = {
      iResolution: { value: [gl.drawingBufferWidth, gl.drawingBufferHeight, 1] },
      iMouse: { value: [0, 0] },
      iTime: { value: 0 },
      uColor0: { value: arr[0] }, uColor1: { value: arr[1] },
      uColor2: { value: arr[2] }, uColor3: { value: arr[3] },
      uColor4: { value: arr[4] }, uColor5: { value: arr[5] },
      uColor6: { value: arr[6] }, uColor7: { value: arr[7] },
      uColorCount: { value: count },
      uFlow: { value: flowVec(CFG.flowDirection) },
      uSpeed: { value: CFG.speed },
      uScale: { value: CFG.scale },
      uTurbulence: { value: CFG.turbulence },
      uFluidity: { value: CFG.fluidity },
      uRimWidth: { value: CFG.rimWidth },
      uSharpness: { value: CFG.sharpness },
      uShimmer: { value: CFG.shimmer },
      uGlow: { value: CFG.glow },
      uOpacity: { value: CFG.opacity },
      uMouseEnabled: { value: CFG.mouseInteraction ? 1 : 0 },
      uMouseStrength: { value: CFG.mouseStrength },
      uMouseRadius: { value: CFG.mouseRadius },
    };

    const program = new Program(gl, { vertex, fragment, uniforms });
    const geometry = new Triangle(gl);
    const mesh = new Mesh(gl, { geometry, program });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      uniforms.iResolution.value = [gl.drawingBufferWidth, gl.drawingBufferHeight, 1];
    }
    resize();
    window.addEventListener('resize', resize);

    let mouseTarget = [0, 0];
    let lastTime = 0;

    function onPointerMove(e) {
      const sc = renderer.dpr || 1;
      const x = e.clientX * sc;
      const y = (window.innerHeight - e.clientY) * sc;
      mouseTarget = [x, y];
    }
    if (CFG.mouseInteraction) {
      window.addEventListener('pointermove', onPointerMove);
    }

    function loop(t) {
      requestAnimationFrame(loop);
      uniforms.iTime.value = t * 0.001;
      if (CFG.mouseDampening > 0) {
        if (!lastTime) lastTime = t;
        const dt = (t - lastTime) / 1000;
        lastTime = t;
        const tau = Math.max(1e-4, CFG.mouseDampening);
        let factor = 1 - Math.exp(-dt / tau);
        if (factor > 1) factor = 1;
        const cur = uniforms.iMouse.value;
        cur[0] += (mouseTarget[0] - cur[0]) * factor;
        cur[1] += (mouseTarget[1] - cur[1]) * factor;
      }
      try {
        renderer.render({ scene: mesh });
      } catch (e) {
        console.error(e);
      }
    }
    requestAnimationFrame(loop);

    // Substitui o canvas placeholder pelo canvas real do OGL.
    canvas.replaceWith(gl.canvas);
    gl.canvas.id = 'bg-canvas';
    Object.assign(gl.canvas.style, { position: 'fixed', inset: '0', width: '100%', height: '100%', display: 'block', zIndex: '0' });
  }

  initFerrofluid(document.getElementById('bg-canvas'));
</script>

<script>
  // ============================================================
  // NEON BORDER — porta em vanilla JS/CSS do componente Originkit.
  // Dois arcos (conic-gradient) percorrem o perímetro do cartão de
  // login em loop contínuo, com camadas de glow em blend aditivo.
  // Recolorido para branco.
  // ============================================================
  (function () {
    const OPTS = {
      color: '#ffffff',
      radius: 20,      // px — casa com border-radius do .login-card
      thickness: 2,     // px
      borderSize: 45,   // % do perímetro coberto pelo arco
      glow: 70,         // 0-100
      speed: 10,        // 1-20, quanto maior mais rápido
    };

    const GLOW_LAYERS = [
      { blur: 8, opacity: 0.5, reach: 0.3 },
      { blur: 15, opacity: 0.3, reach: 0.6 },
      { blur: 40, opacity: 0.16, reach: 1 },
    ];
    const MAX_GLOW_REACH = 30;
    const EDGE_COPIES = 2;
    const ARC_SAMPLES = 24;
    const MIN_ARC = 0.015;
    const SLOWEST_CYCLE = 30, FASTEST_CYCLE = 4;
    const GLIDE_EASE = [0.65, 0, 0.35, 1];

    function withAlpha(hex, alpha) {
      const a = Math.max(0, Math.min(1, alpha));
      const h = hex.replace('#', '');
      const n = parseInt(h, 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    }

    function perimeterPoint(u, w, h) {
      const d = (((u % 1) + 1) % 1) * 2 * (w + h);
      if (d < w) return [d, 0];
      if (d < w + h) return [w, d - w];
      if (d < w * 2 + h) return [w - (d - w - h), h];
      return [0, h - (d - w * 2 - h)];
    }

    function cornerLap(k, w, h) {
      const p = 2 * (w + h);
      const at = [0, w / p, (w + h) / p, (w * 2 + h) / p];
      return Math.floor(k / 4) + at[((k % 4) + 4) % 4];
    }

    function perimeterAngle(u, w, h) {
      const [x, y] = perimeterPoint(u, w, h);
      return (Math.atan2(x - w / 2, h / 2 - y) * 180) / Math.PI;
    }

    function buildArc(lap, lengthPct, w, h, color) {
      const fw = w > 0 ? w : 100;
      const fh = h > 0 ? h : 100;
      const len = Math.max(0, Math.min(100, lengthPct));
      const span = Math.max(MIN_ARC, (len / 100) * 0.5);
      const solidT = len / 100;

      const stops = [];
      let base = 0, prev = 0, acc = 0;

      for (let i = 0; i <= ARC_SAMPLES; i++) {
        const f = i / ARC_SAMPLES;
        const angle = perimeterAngle(lap + (f - 0.5) * span, fw, fh);
        if (i === 0) { base = angle; }
        else {
          let d = angle - prev;
          while (d > 180) d -= 360;
          while (d < -180) d += 360;
          acc += d;
        }
        prev = angle;

        const t = Math.abs(f - 0.5) * 2;
        const k = solidT >= 1 ? 1 : t <= solidT ? 1 : 1 - (t - solidT) / (1 - solidT);
        stops.push(`${withAlpha(color, k * k * (3 - 2 * k))} ${acc.toFixed(2)}deg`);
      }
      const end = acc.toFixed(2);
      stops.push(`${withAlpha(color, 0)} ${end}deg`);
      stops.push(`${withAlpha(color, 0)} 360deg`);

      return `conic-gradient(from ${base.toFixed(2)}deg at 50% 50%, ${stops.join(', ')})`;
    }

    function makeEaseFn(pts) {
      const [x1, y1, x2, y2] = pts;
      const bez = (a, b, t) => { const u = 1 - t; return 3*u*u*t*a + 3*u*t*t*b + t*t*t; };
      return (t) => {
        const x = Math.max(0, Math.min(1, t));
        let s = x;
        for (let i = 0; i < 8; i++) {
          const cx = bez(x1, x2, s) - x;
          const u = 1 - s;
          const dx = 3*u*u*x1 + 6*u*s*(x2-x1) + 3*s*s*(1-x2);
          if (Math.abs(dx) < 1e-6) break;
          s -= cx / dx;
          s = Math.max(0, Math.min(1, s));
        }
        return bez(y1, y2, s);
      };
    }
    const glideEase = makeEaseFn(GLIDE_EASE);

    function applyMask(el) {
      el.style.webkitMaskImage = 'linear-gradient(#fff 0 0), linear-gradient(#fff 0 0)';
      el.style.webkitMaskClip = 'content-box, border-box';
      el.style.webkitMaskComposite = 'xor';
      el.style.maskImage = 'linear-gradient(#fff 0 0), linear-gradient(#fff 0 0)';
      el.style.maskClip = 'content-box, border-box';
      el.style.maskComposite = 'exclude';
    }

    function band(r, offset, radius) {
      const d = document.createElement('div');
      d.style.position = 'absolute';
      const inset = offset - r;
      d.style.inset = inset + 'px';
      d.style.boxSizing = 'border-box';
      d.style.padding = r + 'px';
      d.style.borderRadius = radius > 0 ? (radius + r) + 'px' : '0';
      d.style.background = 'var(--arc)';
      applyMask(d);
      return d;
    }

    function glowLayer(r, blurPx, opacity, glowOuter, radius) {
      const d = document.createElement('div');
      d.style.position = 'absolute';
      d.style.inset = (-glowOuter) + 'px';
      d.style.boxSizing = 'border-box';
      d.style.padding = glowOuter + 'px';
      d.style.borderRadius = radius > 0 ? (radius + glowOuter) + 'px' : '0';
      d.style.opacity = opacity;
      d.style.mixBlendMode = 'plus-lighter';
      d.style.filter = blurPx ? `blur(${blurPx}px)` : 'none';
      applyMask(d);
      d.appendChild(band(r, glowOuter, radius));
      return d;
    }

    function glowGroup(startLap, opts, size) {
      const { radius, thickness, borderSize, glow, color } = opts;
      const amount = Math.max(0, Math.min(100, glow)) / 100;
      const ringAt = (share) => thickness + amount * MAX_GLOW_REACH * share;
      const glowOuter = 10 + MAX_GLOW_REACH * 2;

      const root = document.createElement('div');
      root.style.position = 'absolute';
      root.style.inset = '0';
      root.style.overflow = 'visible';
      root.style.pointerEvents = 'none';
      root.style.setProperty('--arc', buildArc(startLap, borderSize, size.w, size.h, color));

      if (amount > 0) {
        GLOW_LAYERS.forEach((l) => {
          root.appendChild(glowLayer(ringAt(l.reach), l.blur, l.opacity, glowOuter, radius));
        });
      }
      for (let i = 0; i < EDGE_COPIES; i++) {
        const edge = document.createElement('div');
        edge.style.position = 'absolute';
        edge.style.inset = '0';
        edge.style.mixBlendMode = 'plus-lighter';
        edge.appendChild(band(thickness, 0, radius));
        root.appendChild(edge);
      }
      return root;
    }

    function initNeonBorder(mountEl, opts) {
      const size = { w: 0, h: 0 };
      const groupA = glowGroup(0, opts, size);
      const groupB = glowGroup(0.5, opts, size);
      mountEl.appendChild(groupA);
      mountEl.appendChild(groupB);

      function measure() {
        const r = mountEl.getBoundingClientRect();
        size.w = r.width;
        size.h = r.height;
      }
      measure();
      window.addEventListener('resize', measure);
      const parent = mountEl.parentElement;
      if (parent && typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(measure).observe(parent);
      }

      let lap = 0, corner = 0, stepT = 0, last = performance.now();

      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;

      function frame(now) {
        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
        last = now;
        const s = Math.max(0, Math.min(20, opts.speed));
        if (s > 0) {
          const beat = (SLOWEST_CYCLE + ((FASTEST_CYCLE - SLOWEST_CYCLE) * (s - 1)) / 19) / 4;
          stepT += dt / beat;
          while (stepT >= 1) { stepT -= 1; corner += 1; }
          const eased = glideEase(stepT);

          const fw = size.w > 0 ? size.w : 100;
          const fh = size.h > 0 ? size.h : 100;
          const from = cornerLap(corner, fw, fh);
          const to = cornerLap(corner + 1, fw, fh);
          lap = from + (to - from) * eased;

          groupA.style.setProperty('--arc', buildArc(lap, opts.borderSize, fw, fh, opts.color));
          groupB.style.setProperty('--arc', buildArc(lap + 0.5, opts.borderSize, fw, fh, opts.color));
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    initNeonBorder(document.getElementById('neonMount'), OPTS);
  })();

  // ============================================================
  // Máquina de escrever + transição para o formulário de login
  // ============================================================
  (function () {
    const text = "Bem-vindo";
    const typeDelayMs = 90;
    const holdBeforeLoginMs = 1600;

    const typedEl = document.getElementById('typedText');
    const welcomeStage = document.getElementById('welcome-stage');
    const loginStage = document.getElementById('login-stage');

    let i = 0;
    function typeNext() {
      if (i < text.length) {
        typedEl.textContent += text[i];
        i++;
        setTimeout(typeNext, typeDelayMs);
      } else {
        setTimeout(showLogin, holdBeforeLoginMs);
      }
    }

    function showLogin() {
      welcomeStage.classList.add('fade-out');
      loginStage.classList.add('show');
    }

    typeNext();
  })();

  // ============================================================
  // TEXT REVEAL WALL — porta em vanilla JS do componente Originkit.
  // Várias linhas de caracteres aleatórios "embaralham" e se
  // assentam (viram espaço em branco), revelando a palavra-alvo
  // repetida pela tela, que fica destacada em cor sólida.
  // ============================================================
  (function () {
    const ALL_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const wallEl = document.getElementById('result-wall');
    const screenEl = document.getElementById('result-screen');

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    let activeLines = [];
    let animId = null;

    function clearWall() {
      if (animId) cancelAnimationFrame(animId);
      animId = null;
      activeLines = [];
      wallEl.innerHTML = '';
    }

    // Constrói o conteúdo de uma linha para um dado par de progressos.
    function buildLineHTML(totalChars, wordStart, wordEnd, word, revealProgress, settleProgress, wordColor, bgColor) {
      const numChars = Math.floor(revealProgress * totalChars);
      const settledChars = Math.floor(settleProgress * totalChars);
      let html = '';
      let i = 0;
      while (i < totalChars) {
        const inWord = i >= wordStart && i < wordEnd;
        if (inWord) {
          if (i < numChars) {
            // monta a palavra inteira de uma vez ao alcançar seu início
            let text = '';
            let j = i;
            while (j < wordEnd && j < numChars) { text += word[j - wordStart]; j++; }
            html += `<span style="color:${wordColor};font-weight:600">${text}</span>`;
            i = j;
          } else {
            html += '<span>\u00a0</span>';
            i++;
          }
          continue;
        }
        if (i >= numChars) {
          html += '<span>\u00a0</span>';
        } else if (i < settledChars) {
          html += '<span>\u00a0</span>';
        } else {
          const ch = ALL_CHARS[randomInt(0, ALL_CHARS.length - 1)];
          html += `<span style="color:${bgColor}">${ch}</span>`;
        }
        i++;
      }
      return html;
    }

    /**
     * Mostra a parede de texto revelando `word` repetidas vezes.
     * onDone é chamado quando a animação de entrada termina.
     */
    function showWall(word, color, onDone) {
      clearWall();
      screenEl.classList.add('show');

      const fontSize = Math.max(14, Math.min(28, Math.floor(window.innerWidth / 40)));
      const bgColor = 'rgba(255,255,255,0.22)';
      const charWidth = fontSize * 0.62; // aproximação para monospace
      const totalChars = Math.max(20, Math.floor((window.innerWidth * 0.92) / charWidth));
      const lineHeight = fontSize + 4;
      const numLines = Math.max(8, Math.floor(window.innerHeight / lineHeight));

      const marginLines = Math.floor(numLines * 0.18);
      const startLine = marginLines;
      const endLine = numLines - marginLines;

      const duration = 0.7;   // segundos
      const stagger = 0.045;  // segundos entre linhas
      const phaseOffset = duration * 0.5;

      for (let li = 0; li < numLines; li++) {
        const lineEl = document.createElement('div');
        lineEl.className = 'wall-line';
        lineEl.style.fontSize = fontSize + 'px';
        wallEl.appendChild(lineEl);

        let hasWord = li >= startLine && li < endLine && word.length < totalChars;
        let wordStart = 0, wordEnd = 0;
        if (hasWord) {
          wordStart = randomInt(0, totalChars - word.length);
          wordEnd = wordStart + word.length;
        }

        activeLines.push({
          el: lineEl,
          delay: (li - startLine >= 0 ? li - startLine : li) * stagger,
          totalChars, wordStart, wordEnd, hasWord, word,
          revealProgress: 0, settleProgress: 0,
        });
      }

      const t0 = performance.now();
      const lastLineDelay = (numLines - 1) * stagger;
      const totalTimeMs = (lastLineDelay + phaseOffset + duration) * 1000;
      let finished = false;

      function frame(now) {
        const elapsed = (now - t0) / 1000;
        activeLines.forEach((line) => {
          const revealT = Math.max(0, Math.min(1, (elapsed - line.delay) / duration));
          const settleT = Math.max(0, Math.min(1, (elapsed - line.delay - phaseOffset) / duration));
          line.revealProgress = easeInOut(revealT);
          line.settleProgress = easeInOut(settleT);
          line.el.innerHTML = buildLineHTML(
            line.totalChars, line.wordStart, line.wordEnd, line.word,
            line.revealProgress, line.settleProgress, color, bgColor
          );
        });

        if (!finished && (now - t0) >= totalTimeMs) {
          finished = true;
          if (onDone) onDone();
        }
        animId = requestAnimationFrame(frame);
      }
      animId = requestAnimationFrame(frame);
    }

    function hideWall(onDone) {
      screenEl.classList.remove('show');
      setTimeout(() => {
        clearWall();
        if (onDone) onDone();
      }, 500);
    }

    window.__icaroWall = { showWall, hideWall };
  })();

  // ============================================================
  // Validação de login — chama o backend (Node/Express + MongoDB)
  // hospedado no Render.
  // ============================================================
  (function () {
    // TODO: troque pela URL real do seu serviço no Render, ex:
    // 'https://icaro-backend.onrender.com'
    const API_BASE_URL = 'https://icarov2backend.onrender.com';

    const form = document.getElementById('loginForm');
    const userInput = document.getElementById('user');
    const passInput = document.getElementById('pass');
    const errorMsg = document.getElementById('loginError');
    const loginStage = document.getElementById('login-stage');
    const submitBtn = form.querySelector('.login-btn');
    const submitBtnDefaultText = submitBtn.textContent;

    function setInvalidState(isInvalid, message) {
      userInput.classList.toggle('invalid', isInvalid);
      passInput.classList.toggle('invalid', isInvalid);
      if (message) errorMsg.textContent = message;
      errorMsg.classList.toggle('show', isInvalid);
    }

    async function attemptLogin(username, password) {
      const res = await fetch(API_BASE_URL + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        return { ok: false, error: data.error || 'Usuário ou senha inválidos.' };
      }
      return { ok: true, token: data.token, user: data.user };
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      setInvalidState(false);

      const username = userInput.value.trim();
      const password = passInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';

      let result;
      try {
        result = await attemptLogin(username, password);
      } catch (err) {
        console.error('[ÍCARO] erro ao conectar no backend:', err);
        result = { ok: false, error: 'Não foi possível conectar ao servidor. Tente novamente.' };
      }

      submitBtn.disabled = false;
      submitBtn.textContent = submitBtnDefaultText;

      // Esconde o formulário e mostra a parede de texto revelando
      // o resultado.
      loginStage.classList.remove('show');

      if (result.ok) {
        // Guarda o token pra usar nas próximas telas/rotas protegidas.
        localStorage.setItem('icaro_token', result.token);
        localStorage.setItem('icaro_user', JSON.stringify(result.user || {}));

        const isAdmin = result.user && result.user.role === 'admin';
        const destination = isAdmin ? 'admin.html' : 'globo.html';

        window.__icaroWall.showWall('ACESSO GARANTIDO', '#4ade80', function () {
          setTimeout(function () {
            window.location.href = destination;
          }, 1400);
        });
      } else {
        window.__icaroWall.showWall('INVÁLIDO', '#ff5c5c', function () {
          setTimeout(function () {
            window.__icaroWall.hideWall(function () {
              loginStage.classList.add('show');
              passInput.value = '';
              setInvalidState(true, result.error);
              userInput.focus();
            });
          }, 1200);
        });
      }
    });
  })();
</script>
